name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: defardas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d defardas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose config --quiet
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/defardas_test
          DATABASE_SSL_MODE: disable
          DATABASE_POOL_MAX: 1
      - name: Verify backup and restore in isolated database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_USER: postgres
          POSTGRES_DB: defardas_test
        run: |
          task_backup_dir="$(mktemp -d)"
          BACKUP_DIR="$task_backup_dir" bash scripts/backup.sh
          task_backup_file="$(find "$task_backup_dir" -name '*.sql.gz' -print -quit)"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -c 'CREATE DATABASE defardas_restore_test'
          POSTGRES_DB=defardas_restore_test bash scripts/restore.sh "$task_backup_file" --force
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d defardas_restore_test -Atc 'SELECT count(*) > 0 FROM producao.production_orders')" = t
          task_counts_sql="SELECT 'clients',count(*) FROM crm.clients UNION ALL SELECT 'quotes',count(*) FROM crm.quotes UNION ALL SELECT 'orders',count(*) FROM producao.production_orders UNION ALL SELECT 'finance',count(*) FROM financeiro.transactions UNION ALL SELECT 'movements',count(*) FROM estoque.movements UNION ALL SELECT 'audit',count(*) FROM core.audit_logs ORDER BY 1"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d defardas_test -Atc "$task_counts_sql")" = "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d defardas_restore_test -Atc "$task_counts_sql")"
          task_receipts_sql="SELECT md5(COALESCE(string_agg(id::text || payload::text, '' ORDER BY id),'')) FROM core.event_log WHERE event_type='FINANCE_MANUAL_CREATED'"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d defardas_test -Atc "$task_receipts_sql")" = "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d defardas_restore_test -Atc "$task_receipts_sql")"
          { gunzip -c "$task_backup_file"; echo '-- changed bytes'; } | gzip > "$task_backup_dir/tampered.sql.gz"
          cp "$task_backup_file.sha256" "$task_backup_dir/tampered.sql.gz.sha256"
          if POSTGRES_DB=defardas_restore_test bash scripts/restore.sh "$task_backup_dir/tampered.sql.gz" --force; then
            echo 'Restore should reject changed bytes even when checksum names another file' >&2
            exit 1
          fi
      - name: Verify production image
        run: |
          docker build -t defardas-ci .
          docker run -d --name defardas-ci --network host -e PORT=3300 -e DATABASE_SSL_MODE=disable -e DATABASE_URL=postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/defardas_test defardas-ci
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 --max-time 5 http://localhost:3300/api/health
          curl --fail --max-time 5 http://localhost:3300/ > /dev/null
          task_image_healthy=false
          for task_attempt in $(seq 1 45); do
            if test "$(docker inspect --format '{{.State.Health.Status}}' defardas-ci)" = healthy; then
              task_image_healthy=true
              break
            fi
            sleep 1
          done
          test "$task_image_healthy" = true
          docker stop --time 20 defardas-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' defardas-ci)" = 0
