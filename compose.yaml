# ==============================================================================
# DE FARDAS ERP — Docker Compose Produção
# ERP e PostgreSQL próprio; Redis opcional, WhatsApp somente com provedor real
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Aplicação Principal DE FARDAS (Frontend SPA + Backend Modular Express)
  # ----------------------------------------------------------------------------
  defardas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defardas-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_SSL_MODE=disable
      - DATABASE_URL=postgresql://${POSTGRES_USER:-defardas_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}@defardas-postgres:5432/${POSTGRES_DB:-defardas_db}?sslmode=disable
    env_file:
      - path: .env
        required: false
    depends_on:
      defardas-postgres:
        condition: service_healthy
    networks:
      - defardas-internal
      - defardas-external
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs

  # ----------------------------------------------------------------------------
  # 2. Banco de Dados Principal: PostgreSQL 16 (Drizzle ORM)
  # ----------------------------------------------------------------------------
  defardas-postgres:
    image: postgres:16-alpine
    container_name: defardas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defardas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: ${POSTGRES_DB:-defardas_db}
      TZ: America/Fortaleza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - defardas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defardas_user} -d ${POSTGRES_DB:-defardas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Reserva opcional: aplicação atual não usa Redis para sessões/cache/filas
  # ----------------------------------------------------------------------------
  defardas-redis:
    profiles: [optional-cache]
    image: redis:7-alpine
    container_name: defardas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - defardas-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WA-AKG não é provisionado: configure endpoint real homologado no ambiente.

# ==============================================================================
# Redes e Volumes Persistentes
# ==============================================================================
networks:
  defardas-internal:
    driver: bridge
    internal: true
  defardas-external:
    driver: bridge

volumes:
  postgres_data:
    name: defardas_postgres_data
  redis_data:
    name: defardas_redis_data
  app_uploads:
    name: defardas_app_uploads
  app_logs:
    name: defardas_app_logs
  # Reserva histórica; não apagar volume de credenciais de instalação anterior.
  wa_akg_auth:
    name: defardas_wa_akg_auth
